[env]
# Activate the project venv so mise tasks can use Python and project CLI tools
_.python.venv = "python/rpkilog/.venv"
# Shared terraform provider plugin cache. One declaration covers local dev and CI.
# Note: this may not speed up `tf-lock`, whose cross-platform `providers lock`
# downloads might bypass the plugin cache.
TF_PLUGIN_CACHE_DIR = "{{config_root}}/.terraform.d/plugin-cache"

[tools]
# Atlas Community Edition: applies the snapshot-db schema migrations
"atlas-community" = "1.2.0"
# Terraform: pinned so Claude, humans, and CI all run the same version (dev root requires ~> 1.15.0)
terraform = "1.15.6"
