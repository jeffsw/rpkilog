# See https://pre-commit.com/hooks.html for available hooks
repos:
  - repo: 'https://github.com/pre-commit/pre-commit-hooks'
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: '\.svg$'
      - id: no-commit-to-branch
  - repo: local
    hooks:
      # Re-hash atlas migration dirs so an edited *.sql can't be committed with a stale atlas.sum.
      # Auto-fixes like end-of-file-fixer: a rewritten atlas.sum aborts the commit until staged.
      # pass_filenames is off because migrate-hash scans the migrations dirs itself.
      - id: atlas-migrate-hash
        name: atlas migration checksums (mise run migrate-hash)
        entry: mise run migrate-hash
        language: system
        files: '(migrations/.*\.sql|atlas\.sum)$'
        pass_filenames: false
      # terraform fmt -check + init -backend=false + validate, reusing the one mise definition.
      # Runs only when *.tf files are involved; pass_filenames is off because verify-tf scans
      # all roots/modules itself.
      - id: terraform-verify
        name: terraform fmt/validate (mise run verify-tf)
        entry: mise run verify-tf
        language: system
        files: '\.tf$'
        pass_filenames: false
