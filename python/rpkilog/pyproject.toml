[build-system]
requires = ['build', 'setuptools']
build-backend = 'setuptools.build_meta'

[project]
name = 'rpkilog'
version = '0.26071901'
authors = [{ name = 'Jeff Wheeler', email = 'jeffsw6@gmail.com' }]
dependencies = [
    "boto3",
    "boto3-stubs~=1.43.14",
    "botocore>=1.43.14",
    # 2.0 (pure-Python mode) is still a release candidate; the rc in the specifier opts in to pre-releases
    'mariadb >= 2.0.0rc0',
    'netaddr',
    'opensearch-py',
    'psutil',
    'pydantic',
    'python-dateutil',
    'pyyaml',
    'requests',
    'requests_aws4auth',
    'tenacity',
    'tqdm',
    "types-boto3[s3]~=1.43.14",
]
description = 'A web tool for searching RPKI history'
keywords = [
    'BGP',
    'RPKI',
]
# setuptools doesn't implement PEP 639 (yet).  This causes `python -m build` to fail when both `project.license`
# is set AND the `LICENSE` **file** exists.  I'll comment out project.license for now.
#license = 'MIT'
readme = 'README.md'
requires-python = '>=3.12'
urls.homepage = 'https://rpkilog.com'
urls.source = 'https://github.com/jeffsw/rpkilog/python/rpkilog/'
[project.optional-dependencies]
dev = [
    'types-boto3[s3]',
    'build',
    'flake8',
    'lambda-zip',
    # pip is a dependency of lambda-zip but missing from its deps.  Need to fix in that package.
    'pip',
    'prek',
    'pytest',
]
tests = [
    'flake8',
    'pytest'
]

[dependency-groups]
dev = [
    'types-boto3[s3]',
    'build',
    'flake8',
    'lambda-zip',
    # pip is a dependency of lambda-zip but missing from its deps.  Need to fix in that package.
    'pip',
    'prek',
    'pytest',
]

[project.scripts]
rpkilog-archive-site-crawler = 'rpkilog.archive_site_crawler:ArchiveSiteCrawler.cli_entry_point'
rpkilog-database-security-group = 'rpkilog.sqldb:database_security_group_cli_entry_point'
rpkilog-diff-import = 'rpkilog:VrpDiff.cli_entry_point_import'
rpkilog-diff-import-from-sqs = 'rpkilog:VrpDiff.cli_entry_point_diff_import_from_sqs'
rpkilog-hapi = 'rpkilog.hapi:cli_entry_point'
rpkilog-ingest-tar = 'rpkilog:IngestTar.cli_entry_point'
rpkilog-process-snapshot-summary-queue = 'rpkilog.process_snapshot_summary_queue:cli_entry_point'
rpkilog-reconcile = 'rpkilog.reconcile:cli_entry_point'
rpkilog-routinator-vrp-fetcher = 'rpkilog.routinator_vrp_fetcher:cli_entry_point'
rpkilog-rpkiclient-uploader = 'rpkilog.rpkiclient_uploader:cli_entry_point'
rpkilog-vrp-cache-differ = 'rpkilog:VrpDiff.cli_entry_point'

[tool.black]
line-length = 120

[tool.setuptools.package-data]
rpkilog = ['reconcile_config.yml']

[tool.lambda_zip]
upload_s3_url = 's3://rpkilog-artifact/lambda_rpkilog.zip'

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
markers = [
    "slow: some end-to-end tests are slow and may be skipped in draft PR commits and pre-commit hooks"
]
# tests on sys.path so test modules can import shared helpers (fake_db, test_util's fake bucket),
# which --import-mode=importlib does not provide by itself
pythonpath = ["tests"]
testpaths = ["tests"]
